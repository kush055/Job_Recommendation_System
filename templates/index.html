{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSniff</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 70, 140, 0.5), rgba(0, 70, 140, 0.5)),
            url("{% static 'images/bg1.jpg' %}") no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .container {
            background: rgba(0, 80, 160, 0.4);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 480px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .logo {
            width: 100px;
            margin-bottom: 1rem;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #e0f0ff;
        }

        .slogan {
            font-size: 1rem;
            font-style: italic;
            color: #d0e8ff;
            margin-bottom: 1.5rem;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @media (min-width: 500px) {
            .buttons {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: rgba(0, 120, 220, 0.6);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(0, 140, 240, 0.8);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="{% static 'images/logo1.jpg' %}" alt="SkillSniff Logo" class="logo" />
        <h1>Welcome To SkillSniff</h1>
        <p class="slogan">Discover Your Next Opportunity</p>
        <div class="buttons">
            <a href="{% url 'accounts:login' %}" class="btn">Login</a>
            <a href="{% url 'accounts:register' %}" class="btn">Register</a>
            <a href="{% url 'about' %}" class="btn">About Us</a>
        </div>
    </div>
</body>

</html>
