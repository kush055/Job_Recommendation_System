{% extends 'base.html' %}
{% load static %}

{% block title %}Home - SkillSniff{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4 sm:px-6 py-12 sm:py-20">
  <div
    class="w-full max-w-2xl bg-white bg-opacity-10 backdrop-blur-md rounded-2xl px-6 sm:px-10 py-10 sm:py-12 shadow-xl text-white text-center animate__animated animate__fadeInUp">

    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold mb-8">Welcome to <span class="text-blue-200">SkillSniff</span>
    </h1>

    <!-- Button group -->
    <div class="flex flex-wrap justify-center gap-4 sm:gap-6">
      <!-- Login -->
      <a href="{% url 'accounts:login' %}">
        <button
          class="w-36 bg-white text-indigo-700 font-semibold px-6 py-2 rounded-full shadow-md hover:bg-indigo-100 transition duration-300">
          Login
        </button>
      </a>

      <!-- Register -->
      <a href="{% url 'accounts:register' %}">
        <button
          class="w-36 bg-white text-indigo-700 font-semibold px-6 py-2 rounded-full shadow-md hover:bg-indigo-100 transition duration-300">
          Register
        </button>
      </a>

      <!-- About Us -->
      <a href="{% url 'about' %}">
        <button
          class="w-36 bg-white text-indigo-700 font-semibold px-6 py-2 rounded-full shadow-md hover:bg-indigo-100 transition duration-300">
          About Us
        </button>
      </a>
    </div>

  </div>
</div>
{% endblock %}
