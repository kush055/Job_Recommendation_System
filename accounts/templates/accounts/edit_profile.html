{% extends 'base.html' %}
{% block title %}Edit Profile | SkillSniff{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen px-4 py-10">
    <div
        class="w-full max-w-3xl bg-blue-900 bg-opacity-70 backdrop-blur-md rounded-3xl shadow-xl p-8 text-white animate-fade-in-up">
        <h2 class="text-3xl font-bold text-center mb-6">Edit Your Profile</h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block mb-2 text-sm text-sky-200">First Name</label>
                    <input type="text" name="first_name" value="{{ request.user.first_name }}"
                        class="w-full px-4 py-2 rounded-lg bg-white bg-opacity-10 text-white placeholder-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-500"
                        required>
                </div>

                <div>
                    <label class="block mb-2 text-sm text-sky-200">Last Name</label>
                    <input type="text" name="last_name" value="{{ request.user.last_name }}"
                        class="w-full px-4 py-2 rounded-lg bg-white bg-opacity-10 text-white placeholder-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-500"
                        required>
                </div>

                <div class="md:col-span-2">
                    <label class="block mb-2 text-sm text-sky-200">Bio</label>
                    <textarea name="bio" rows="3"
                        class="w-full px-4 py-2 rounded-lg bg-white bg-opacity-10 text-white placeholder-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-500">{{ profile.bio }}</textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="block mb-2 text-sm text-sky-200">Profile Picture</label>
                    <input type="file" name="profile_picture" accept="image/*"
                        class="w-full text-sm text-sky-100 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-sky-700 file:text-white hover:file:bg-sky-800">
                    {% if profile.profile_picture %}
                    <p class="text-sky-300 mt-2">Current: <img src="{{ profile.profile_picture.url }}"
                            class="inline-block w-16 h-16 rounded-full ml-2" alt="Profile Picture"></p>
                    {% endif %}
                </div>
            </div>

            <div class="text-center pt-4">
                <button type="submit"
                    class="bg-sky-600 hover:bg-sky-700 text-white font-semibold px-6 py-2 rounded-xl transition duration-200 transform hover:scale-105 shadow-lg">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
    @keyframes fade-in-up {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in-up {
        animation: fade-in-up 0.6s ease-out both;
    }
</style>
{% endblock %}
